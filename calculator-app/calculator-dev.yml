apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: calculator-dev
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/Prem-krish-308/calculator-app.git
    targetRevision: main
    path: calculator-app
    helm:
      valueFiles:
        - values-dev.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: calculator-dev

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true